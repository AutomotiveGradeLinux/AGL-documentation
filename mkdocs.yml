site_name: AGL Documentation
site_url: http://docs.automotivelinux.org/
site_author: Shankho Boron Ghosh
theme_dir: 'theme/mkdocs_windmill'
theme:
  name: null
  custom_dir: 'theme/mkdocs_windmill'
  # Copy settings from mkdocs_theme.yml, which is ignored by custom_dir themes.
  static_templates: [404.html]
  search_index_only: true
  include_search_page: true

plugins:
  - search:
      separator: '[\s\-\_]+'
  - macros

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

# Release-identity variables, updated once per AGL release cut instead of
# find/replacing hardcoded branch/codename strings across docs/**/*.md.
# See main.py for the one derived value (agl_download_base) computed from
# these at build time.
extra:
  agl:
    codename: vimba
    full_name: "Vibrant Vimba"
  yocto:
    codename: wrynose
    version: "6.0.x"
  qt_layer_branch: "6.12"
  # "release" (post branch-cut, published artifacts) or "snapshots"
  # (pre-cut / rolling CI builds, which always live under .../master/).
  artifact_kind: release
